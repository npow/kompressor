[package]
name = "kompressor"
version = "0.1.0"
edition = "2021"
description = "~60x faster, byte-exact rANS entropy coder for CompressAI mbt2018_mean"
license = "MIT"
repository = "https://github.com/npow/kompressor"
readme = "README.md"
keywords = ["rans", "entropy-coding", "compression", "codec", "compressai"]
categories = ["compression", "encoding", "algorithms"]

[lib]
name = "kompressor"
crate-type = ["rlib", "cdylib"]

[dependencies]
rayon = "1.10"
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }

[features]
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
