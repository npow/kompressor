[package]
name = "kompressor"
version = "0.1.0"
edition = "2021"
description = "Drop-in, byte-exact-compatible parallel rANS entropy coder for CompressAI's mean-scale hyperprior models (mbt2018_mean), ~60x faster than the reference Python/C++ implementation."
license = "MIT"

[dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
